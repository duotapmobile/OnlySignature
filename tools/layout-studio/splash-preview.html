<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editable native splash</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      body {
        display: grid;
        place-items: center;
        background: #020b12;
      }
      .native-asset {
        position: relative;
        width: 430px;
        height: 932px;
        flex: none;
        background: #020b12;
        overflow: hidden;
      }
      .baseline {
        position: absolute;
        top: 252px;
        left: 50%;
        transform: translateX(-50%);
      }
      [data-testid="layout-slot:splash.wordmark"] {
        width: 315px;
      }
      img {
        display: block;
        width: 100%;
        height: auto;
        pointer-events: none;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <div class="native-asset" aria-label="Native splash asset canvas">
      <div class="baseline">
        <div data-testid="layout-slot:splash.wordmark">
          <img
            src="/studio-assets/only-signature-wordmark.png"
            alt="Only Signature wordmark"
          />
        </div>
      </div>
    </div>
  </body>
</html>
