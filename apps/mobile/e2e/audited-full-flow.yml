appId: com.duotap.onlysignature
---
- launchApp:
    clearState: true
- openLink: "onlysignature:///?fixture=landing"
- assertVisible: "Without the sign-up."
- tapOn: "Create My Signing Set"
- assertVisible: "Add your signature"
- openLink: "onlysignature:///draw?fixture=both"
- tapOn: "Sign First and Last Separately"
- assertVisible: "Add your first name"
- tapOn: "Save First Name"
- assertVisible: "Add your last name"
- swipe:
    start: "24%, 45%"
    end: "76%, 45%"
    duration: 900
- tapOn: "Save Last Name and Join"
- assertVisible: "Add your initials"
- tapOn: "Save Initials"
- assertVisible: "Confirm Your Signing Set"
- tapOn: "Confirm and Choose Background"
- assertVisible: "Choose Your Background"
- tapOn: "White Background"
- tapOn: "Continue With White Background"
- assertVisible: "Clear Background"
- assertVisible: "Looks natural on any document."
- assertVisible: "White box"
- tapOn: "No Thanks"
- assertVisible: "Removing the background later can damage your signature."
- tapOn: "No Thanks, Download Free White Set"
- assertVisible: "White Background Export"
- openLink: "onlysignature:///success?mode=free"
- assertVisible: "White Background Set Saved"
- tapOn: "Done"
- assertVisible: "My Signing Sets"
- openLink: "onlysignature:///success?mode=transparent"
- assertVisible: "Transparent Set Unlocked"
- openLink: "onlysignature:///saved?fixture=purchased"
- assertVisible: "My Signing Sets"
- assertVisible: "Export"
