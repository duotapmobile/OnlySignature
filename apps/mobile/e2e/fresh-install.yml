appId: com.duotap.onlysignature
---
- launchApp:
    clearState: true
- assertVisible: "Signature and Initials"
- assertVisible: "EXPORT WITH A TRANSPARENT BACKGROUND"
- tapOn: "Create My Signing Set"
- assertVisible: "Add your signature"
- swipe:
    start: "20%, 45%"
    end: "80%, 45%"
    duration: 1000
- assertVisible: "Redo"
- tapOn: "Save Signature"
- assertVisible: "Add your initials"
