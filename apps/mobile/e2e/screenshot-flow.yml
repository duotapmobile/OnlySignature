appId: com.duotap.onlysignature
---
- launchApp:
    clearState: true
- openLink: "onlysignature:///?fixture=landing"
- assertVisible: "Without the sign-up."
- takeScreenshot: "01-entry"
- openLink: "onlysignature:///draw?fixture=both"
- assertVisible: "Sign"
- takeScreenshot: "02-signature-capture"
- tapOn: "Sign First and Last Separately. More room for each name. We’ll align them for you."
- assertVisible: "First name"
- takeScreenshot: "02a-first-name-capture"
- swipe:
    start: "24%, 45%"
    end: "76%, 45%"
    duration: 900
- assertVisible:
    text: "Save First Name"
    enabled: true
- tapOn: "Save First Name"
- assertVisible: "Last name"
- takeScreenshot: "02b-last-name-capture"
- openLink: "onlysignature:///draw?fixture=initials"
- assertVisible: "Initials"
- takeScreenshot: "03-initials-capture"
- tapOn: "Save Initials"
- assertVisible: "Review your signing set"
- takeScreenshot: "04-review"
- tapOn: "Confirm and Choose Background"
- assertVisible: "Choose a background"
- takeScreenshot: "05-background-choice"
- tapOn: 'White Background\. May cover anything behind your signature\.'
- tapOn: "Continue With White Background"
- assertVisible: "See the difference"
- takeScreenshot: "06-background-warning"
- openLink: "onlysignature:///export?fixture=purchased"
- assertVisible: "Export Transparent Set"
- takeScreenshot: "07-transparent-export"
- openLink: "onlysignature:///saved?fixture=purchased"
- assertVisible: "My Signing Sets"
- takeScreenshot: "08-saved-sets"
