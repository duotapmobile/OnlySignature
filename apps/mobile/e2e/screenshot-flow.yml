appId: com.duotap.onlysignature
---
- launchApp:
    clearState: true
- openLink: "onlysignature:///?fixture=landing"
- assertVisible: "Without the sign-up."
- takeScreenshot: "01-entry"
- openLink: "onlysignature:///draw?fixture=both"
- assertVisible: "Add your signature"
- takeScreenshot: "02-signature-capture"
- tapOn: "Save Signature"
- assertVisible: "Add your initials"
- takeScreenshot: "03-initials-capture"
- tapOn: "Save Initials"
- assertVisible: "Confirm Your Signing Set"
- takeScreenshot: "04-review"
- tapOn: "Continue to Background"
- assertVisible: "Choose Your Background"
- takeScreenshot: "05-background-choice"
- tapOn: "White Background"
- tapOn: "Continue With White Background"
- assertVisible: "Background-removal tools can erase fine signature strokes."
- takeScreenshot: "06-background-warning"
- openLink: "onlysignature:///success?fixture=purchased&mode=transparent"
- assertVisible: "Transparent Set Unlocked"
- takeScreenshot: "07-transparent-unlocked"
- openLink: "onlysignature:///saved?fixture=purchased"
- assertVisible: "My Signing Sets"
- takeScreenshot: "08-saved-sets"
